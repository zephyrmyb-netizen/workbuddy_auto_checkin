name: 三账号每日签到
on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "10 6 * * *"
    - cron: "10 12 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wb-daily
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        account: [1, 2, 3]
    name: 账号 ${{ matrix.account }}
    steps:
      - uses: actions/checkout@v4
      - name: 签到与旅行
        env:
          TOKEN_1: ${{ secrets.WB_ACCESS_TOKEN_1 }}
          TOKEN_2: ${{ secrets.WB_ACCESS_TOKEN_2 }}
          TOKEN_3: ${{ secrets.WB_ACCESS_TOKEN_3 }}
          ACCOUNT: ${{ matrix.account }}
          WB_RESULT_FILE: ${{ runner.temp }}/result.json
        run: |
          case "$ACCOUNT" in
            1) export WB_ACCESS_TOKEN="$TOKEN_1" ;;
            2) export WB_ACCESS_TOKEN="$TOKEN_2" ;;
            3) export WB_ACCESS_TOKEN="$TOKEN_3" ;;
          esac
          unset TOKEN_1 TOKEN_2 TOKEN_3
          set +e
          python3 wb_auto.py
          result=$?
          if [ -f "$WB_RESULT_FILE" ]; then cat "$WB_RESULT_FILE" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$result"
